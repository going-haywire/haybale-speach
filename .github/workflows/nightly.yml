# The same checks every night, on Linux and macOS, against core's master as it is then:
# a red run means a core change broke this library. Core's release view reads the latest
# result (`release_sweep.py nightly`).
name: nightly

on:
  schedule:
    - cron: '17 3 * * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ci:
    uses: going-haywire/.github/.github/workflows/library-ci.yml@d3086f58c20bfbdece1f0015334d52728518d424 # 2026-11-23, going-haywire/.github
