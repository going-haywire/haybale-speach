[project]
name = "haybale-speech-dev"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [ "haywire-studio>=0.6.1", "haybale-studio>=0.6.1", "haybale-marketplace>=0.6.1", "haybale-core>=0.6.1", "haybale-graph-editor>=0.6.1", "haybale-haystack>=0.6.1", "haybale-audio>=0.6.1", "haybale-models>=0.6.1", "haybale-speech",]

[dependency-groups]
dev = ["pytest>=8", "pytest-timeout", "ruff==0.12.12"]

[tool.uv.workspace]
members = [ "barn/*",]

[tool.ruff]
line-length = 109

[tool.ruff.lint]
extend-select = [ "TID251", "TID252",]

[tool.uv.sources.haywire-studio]
path = "../haywire-repo/packages/haywire-studio"
editable = true

[tool.uv.sources.haywire-core]
path = "../haywire-repo/packages/haywire-core"
editable = true

[tool.uv.sources.haybale-studio]
path = "../haywire-repo/barn/haybale-studio"
editable = true

[tool.uv.sources.haybale-marketplace]
path = "../haywire-repo/barn/haybale-marketplace"
editable = true

[tool.uv.sources.haybale-core]
path = "../haywire-repo/barn/haybale-core"
editable = true

[tool.uv.sources.haybale-graph-editor]
path = "../haywire-repo/barn/haybale-graph-editor"
editable = true

[tool.uv.sources.haybale-haystack]
path = "../haywire-repo/barn/haybale-haystack"
editable = true

[tool.uv.sources.haybale-audio]
path = "../haywire-repo/barn/haybale-audio"
editable = true

[tool.uv.sources.haybale-models]
path = "../haywire-repo/barn/haybale-models"
editable = true

[tool.uv.sources.haybale-speech]
workspace = true

[tool.ruff.lint.flake8-tidy-imports]
ban-relative-imports = "all"

[tool.ruff.lint.flake8-tidy-imports.banned-api."haywire.core"]
msg = "Import from haywire.api or haywire.api.workbench; this module is internal and may change."

[tool.ruff.lint.flake8-tidy-imports.banned-api."haywire.ui"]
msg = "Import from haywire.api or haywire.api.workbench; this module is internal and may change."

[tool.ruff.lint.flake8-tidy-imports.banned-api."haywire.barn"]
msg = "Import from haywire.api or haywire.api.workbench; this module is internal and may change."

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["TID251"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "unit: Unit tests (fast, isolated)",
    "integration: Integration tests (slower, full system)",
    "slow: needs a real model (runs with SPEECH_MODEL_TESTS=1)",
]
addopts = "-v --strict-markers --tb=short"
timeout = 120

[tool.haywire.agents]
# The docs folder whose `serve: developer` pages the Farmhand bridge serves to agent
# sessions here: core's, through the core clone beside this repository.
developer-docs = "../haywire-repo/docs"
