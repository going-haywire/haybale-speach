# Full field reference: docs/reference/files/pyproject-toml.md
[project]
# ── generated from haybale.toml at publish; hand-edits are reported as drift ─
name = "haybale-speech"  # from haybale.name
description = "Speech-to-text and text-to-speech, with faster-whisper and Kokoro"  # from haybale.description
keywords = ["audio", "speech", "stt", "tts", "models"]  # from haybale.tags

# CANON, but owned by the release machinery — synced to haybale.toml
version = "0.0.3"

# ── authored here ────────────────────────────────────────────────────────────
requires-python = ">=3.12"
license = {text = "MIT"}

# CANON — pip requirements. Add third-party packages and sibling haybales here.
dependencies = [
    "haywire-core>=0.6.1",
    "haybale-audio>=0.6.6",
    "haybale-core>=0.6.1",
    "haybale-models>=0.6.1",
    "faster-whisper>=1.2.1",
    "numpy>=2.0.2",  # kokoro-onnx 0.6.1 needs numpy>=2.0.2
    "samplerate>=0.2.4",
    "ctranslate2>=4.0",  # faster-whisper 1.2.1 needs ctranslate2>=4.0
    # Text-to-speech. kokoro-onnx caps Python below 3.14; there Load Speech Model says the
    # backend is not installed and speech-to-text keeps working.
    "kokoro-onnx>=0.6.1; python_version < '3.14'",
    "onnxruntime>=1.20.1; python_version < '3.14'",
]

# The key is the entry-point name (unique within the group; need not match the
# library id). The value is <module>:<class>.
[project.entry-points."haywire.libraries"]
speech = "haybale_speech:Library"

[project.urls]
Source = "https://github.com/going-haywire/haybale-speech"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

# Declares the package DIRECTORY, so everything not VCS-ignored inside it
# reaches the wheel, including haybale.toml — do not add include/exclude here.
[tool.hatch.build.targets.wheel]
packages = ["haybale_speech"]
